x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}
    compress: ${LOG_COMPRESS:-true}
services:
  coturn:
    container_name: coturn
    image: coturn
    build:
      context: .
      dockerfile_inline: |
        FROM ${IMAGE:-coturn/coturn}
        USER root
        RUN apt-get update \
            && apt-get install -y --no-install-recommends gosu \
            && rm -rf /var/lib/apt/lists/* \
            && ln -s /usr/local/bin/docker-entrypoint.sh /docker-entrypoint.sh
        USER nobody:nogroup
    restart: unless-stopped
    network_mode: host
    logging: *default-logging
    configs:
      - source: turnserver
        target: /etc/coturn/turnserver.conf
    volumes:
      - coturn-data:/var/lib/coturn
      - step-ca-certs:/certs
    user: root
    environment:
      COTURN_DOMAIN: ${COTURN_DOMAIN}
      VIRTUAL_HOST: ${COTURN_DOMAIN}
      VIRTUAL_PORT: 3478
      LETSENCRYPT_HOST: ${COTURN_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -x
        echo "==> COTURN_DOMAIN='$$COTURN_DOMAIN'"
        KEY_PATH="/certs/$$COTURN_DOMAIN/key.pem"

        while [ ! -f "$$KEY_PATH" ]; do
          echo "Waiting for $$KEY_PATH..."
          sleep 3
        done

        chmod 644 "$$KEY_PATH" 2>/dev/null || true
        echo "Permissions fixed. Starting as nobody..."

        if [ $# -eq 0 ]; then
          set -- --log-file=stdout --external-ip=$(detect-external-ip)
        fi

        exec gosu nobody /usr/local/bin/docker-entrypoint.sh "$@"
configs:
  turnserver:
    content: |
      use-auth-secret
      static-auth-secret=${COTURN_SECRET_KEY}
      realm=${COTURN_DOMAIN}
      cert=/certs/${COTURN_DOMAIN}/fullchain.pem
      pkey=/certs/${COTURN_DOMAIN}/key.pem
volumes:
  coturn-data:
    name: coturn-data
  step-ca-certs:
    external: true
