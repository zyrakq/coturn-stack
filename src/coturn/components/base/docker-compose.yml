x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}
    compress: ${LOG_COMPRESS:-true}

services:
  coturn:
    container_name: coturn
    image: ${IMAGE:-docker.io/coturn/coturn}
    restart: unless-stopped
    network_mode: host
    logging: *default-logging
    configs:
      - source: turnserver
        target: /etc/coturn/turnserver.conf
    volumes:
      - coturn-data:/var/lib/coturn

configs:
  turnserver:
    content: |
      use-auth-secret
      static-auth-secret=${COTURN_SECRET_KEY}
      realm=${COTURN_DOMAIN}


volumes:
  coturn-data:
    name: coturn-data
