x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}
    compress: ${LOG_COMPRESS:-true}

services:
  coturn:
    container_name: coturn
    image: coturn
    build:
      context: .
      dockerfile_inline: |
        FROM ${IMAGE:-coturn/coturn}
        USER root
        RUN apt-get update \
            && apt-get install -y --no-install-recommends gosu \
            && rm -rf /var/lib/apt/lists/* \
            && ln -s /usr/local/bin/docker-entrypoint.sh /docker-entrypoint.sh
        USER nobody:nogroup
    restart: unless-stopped
    network_mode: host
    logging: *default-logging
    configs:
      - source: turnserver
        target: /etc/coturn/turnserver.conf
    volumes:
      - coturn-data:/var/lib/coturn

configs:
  turnserver:
    content: |
      use-auth-secret
      static-auth-secret=${COTURN_SECRET_KEY}
      realm=${COTURN_DOMAIN}


volumes:
  coturn-data:
    name: coturn-data
